# Configuración idéntica para ambos brazos del experimento
listen_addresses = '*'
max_connections = 100

# Memoria
shared_buffers = 128MB
work_mem = 4MB
maintenance_work_mem = 64MB
effective_cache_size = 256MB

# WAL
wal_level = minimal
max_wal_senders = 0
synchronous_commit = on

# Checkpoints
checkpoint_completion_target = 0.9
max_wal_size = 256MB
min_wal_size = 80MB

# Logging (desactivado durante medición para evitar I/O asimétrico)
logging_collector = off
log_statement = 'none'
log_min_duration_statement = -1

# Autovacuum (desactivado durante medición)
autovacuum = off

# Planner
random_page_cost = 1.1
effective_io_concurrency = 200
